name: release

on:
  push:
    tags:
      - "v*"
  # Manual runs build every target without publishing, to test the workflow.
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ghostwriter
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ghostwriter
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ghostwriter
          - os: macos-latest
            target: aarch64-apple-darwin # Apple Silicon
            artifact: ghostwriter
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ghostwriter.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: rename artifact
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} \
             dist/ghostwriter-${{ matrix.target }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: ghostwriter-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: |
          sha256sum ghostwriter-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
